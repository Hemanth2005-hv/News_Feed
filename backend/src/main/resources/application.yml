server:
  port: 8080
  servlet:
    # All endpoints live under /api  → e.g. POST /api/auth/login
    context-path: /api

spring:
  datasource:
    # The "newsfeed" database already exists (created via backend/setup.sql).
    # createDatabaseIfNotExist stays on as a safety net.
    url: jdbc:mysql://localhost:3306/newsfeed?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: Hemanthvarma
  jpa:
    hibernate:
      # update = Hibernate creates/updates tables to match the entities
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    # Make sure data.sql runs AFTER Hibernate creates the tables
    defer-datasource-initialization: true
  sql:
    init:
      # Runs data.sql to seed articles (INSERT IGNORE → safe to re-run)
      mode: always

app:
  jwt:
    # IMPORTANT: replace with your own long random string (min 32 chars) in production
    secret: "CHANGE_ME_to_a_long_random_secret_at_least_32_characters_long_0123456789"
    # Token lifetime: 24 hours in milliseconds
    expiration-ms: 86400000
